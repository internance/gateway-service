spring:
  application:
    name: gateway-service

  config:
    import: "optional:configserver:http://localhost:8888"

  threads:
    virtual:
      enabled: true

  cloud:
    gateway:
      mvc:
        routes:          
          - id: auth-service
            uri: lb://auth-service
            predicates:
              - Path=/api/v1/auth/**

        globalcors:
          cors-configurations:
            '[/**]':
              allowedOriginsPatterns: "*"
              allowedMethods: "*"
              allowedHeaders: "*"
              allowCredentials: true

server:
  port: 8000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
  whitelist:
    - /api/v1/auth/**
    - /actuator/**