spring:
  application:
    name: gateway-service
  cloud:
    config:
      enabled: false
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: gateway-service-test
    listener:
      auto-startup: false

config:
  events:
    topic: config-changed

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

jwt:
  secret: ${JWT_SECRET:test-secret-key-for-local-testing-only-change-me}
  whitelist:
    - /api/v1/auth/**
    - /actuator/**
